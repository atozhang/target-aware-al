name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: epig-al
          environment-file: environment.yml
          python-version: "3.12"
      - name: Run test suite
        shell: bash -l {0}
        run: python -m pytest tests/ -q
